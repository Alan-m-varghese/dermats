  <style>
    /* ── PAGE HERO ── */
    .tx-hero {
      background: linear-gradient(135deg, var(--teal-dark) 0%, var(--dark) 60%);
      padding: 9rem 2rem 5rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .tx-hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 60% 40%, rgba(37,184,157,0.18) 0%, transparent 65%);
      pointer-events: none;
    }
    .tx-hero__label {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--teal-light);
      border: 1px solid rgba(37,184,157,0.4);
      padding: 0.35rem 1rem;
      border-radius: 100px;
      background: rgba(37,184,157,0.08);
      margin-bottom: 1.2rem;
    }
    .tx-hero__title {
      font-family: var(--font-display);
      font-size: clamp(2rem, 5vw, 3.8rem);
      color: var(--white);
      font-weight: 400;
      line-height: 1.15;
      margin-bottom: 1rem;
    }
    .tx-hero__title em { font-style: italic; color: var(--teal-light); }
    .tx-hero__sub {
      font-size: 1.05rem;
      color: rgba(255,255,255,0.65);
      max-width: 520px;
      margin: 0 auto 2rem;
      line-height: 1.7;
    }
    .tx-hero__back {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: rgba(255,255,255,0.7);
      font-size: 0.88rem;
      font-weight: 500;
      border: 1px solid rgba(255,255,255,0.2);
      padding: 0.5rem 1.2rem;
      border-radius: 100px;
      transition: all 0.3s ease;
      text-decoration: none;
    }
    .tx-hero__back:hover {
      background: rgba(255,255,255,0.1);
      color: var(--white);
      border-color: rgba(255,255,255,0.4);
    }


    /* ── GRID ── */
    .tx-section {
      padding: 5rem 0 6rem;
      background: var(--dark);
      position: relative;
      overflow: hidden;
    }
    .tx-section::before {
      content: '';
      position: absolute;
      top: -200px; right: -200px;
      width: 600px; height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(26,138,122,0.12), transparent 70%);
      pointer-events: none;
    }
    .tx-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.5rem;
    }
    @media (max-width: 900px) { .tx-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 560px) { .tx-grid { grid-template-columns: 1fr; } }

    /* ── TREATMENT CARD — matches .service-card from home ── */
    .tx-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: var(--radius-lg);
      padding: 2.2rem;
      transition: all var(--transition);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 1.5rem;
    }
    .tx-card__img-container {
      width: 100%;
      height: 200px;
      border-radius: var(--radius-md);
      overflow: hidden;
      margin-bottom: 1.5rem;
      border: 1px solid rgba(255,255,255,0.05);
      position: relative;
    }
    .tx-card__img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .tx-card:hover .tx-card__img {
      transform: scale(1.1);
    }
    .tx-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(26,138,122,0.08), transparent);
      opacity: 0;
      transition: opacity var(--transition);
      pointer-events: none;
      z-index: 0;
    }
    .tx-card > * { position: relative; z-index: 1; }
    .tx-card:hover {
      border-color: rgba(37,184,157,0.3);
      transform: translateY(-6px);
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    }
    .tx-card:hover::before { opacity: 1; }

    .tx-card__num {
      font-family: var(--font-display);
      font-size: 0.8rem;
      color: rgba(255,255,255,0.2);
      letter-spacing: 0.1em;
      margin-bottom: 0.8rem;
    }
    .tx-card__name {
      font-family: var(--font-display);
      font-size: 1.4rem;
      font-weight: 400;
      color: var(--white);
      margin-bottom: 0.6rem;
      line-height: 1.3;
    }
    .tx-card__desc {
      font-size: 0.88rem;
      color: rgba(255,255,255,0.5);
      line-height: 1.7;
      margin-bottom: 1.5rem;
      flex-grow: 1;
    }
    .tx-card__cta {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--white);
      letter-spacing: 0.06em;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
      margin-top: auto;
      padding: 0.65rem 1.4rem;
      border-radius: 100px;
      background: linear-gradient(135deg, var(--teal), var(--teal-dark));
      box-shadow: 0 4px 18px rgba(26,138,122,0.35);
      transition: all var(--transition);
      width: fit-content;
    }

      background: linear-gradient(135deg, var(--teal-light), var(--teal));

      border-radius: var(--radius-xl);
      padding: 3rem 2.5rem;
      text-align: center;
      margin-top: 4rem;
    }
    .tx-banner h3 {
      font-family: var(--font-display);
      font-size: 2rem;
      color: var(--white);
      margin-bottom: 0.6rem;
      font-weight: 400;
    }

      color: rgba(255,255,255,0.75);
      margin-bottom: 1.8rem;
      font-size: 1rem;

    .nav { background: rgba(13,20,18,0.96); backdrop-filter: blur(20px); }
